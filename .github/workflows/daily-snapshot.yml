name: Daily Snapshot

on:
  schedule:
    - cron: '0 6 * * *'  # 6 AM UTC daily
  workflow_dispatch:       # Manual trigger

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Validate required secrets
        run: |
          if [ -z "${{ secrets.DATABASE_URL }}" ]; then
            echo "DATABASE_URL GitHub secret is required for production snapshots."
            exit 1
          fi

      - name: Run snapshot (crypto)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: cd pipeline && python3 snapshot.py --sector crypto --skip-order-books -v

      - name: Run snapshot (politics)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: cd pipeline && python3 snapshot.py --sector politics --skip-order-books -v

      - name: Run snapshot (stocks)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: cd pipeline && python3 snapshot.py --sector stocks --skip-order-books -v

      - name: Run snapshot (economy)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: cd pipeline && python3 snapshot.py --sector economy --skip-order-books -v

      - name: Export dashboard JSON (crypto)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: cd pipeline && python3 export.py --sector crypto -v

      - name: Export dashboard JSON (politics)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: cd pipeline && python3 export.py --sector politics -v

      - name: Export dashboard JSON (stocks)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: cd pipeline && python3 export.py --sector stocks -v

      - name: Export dashboard JSON (economy)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: cd pipeline && python3 export.py --sector economy -v

      - name: Validate exported dashboard JSON
        run: npm run validate:data -- --max-age-days 3

      - name: Update latest_score for public indicators
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: cd pipeline && python3 update_latest_scores.py -v

      - name: Check alerts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: cd pipeline && python3 check_alerts.py -v || echo "Alert check failed (non-critical)"

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: daily snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
