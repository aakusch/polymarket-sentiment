<!DOCTYPE html>
<html lang="en" class="bg-gray-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polymarket Sentiment Indicators</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/@solana/web3.js@1/lib/index.iife.min.js"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
    .tabular-nums { font-variant-numeric: tabular-nums; }
    .page { display: none; }
    .page.active { display: block; }
    .nav-link { transition: color 0.15s, border-color 0.15s; }
    .nav-link.active { color: #e5e7eb; border-bottom-color: #60a5fa; }
    .sparkline { display: inline-block; vertical-align: middle; }
    input[type=range] { -webkit-appearance: none; background: transparent; }
    input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: #1f2937; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; margin-top: -5px; cursor: pointer; }
    input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: #1f2937; border: 0; }
    input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; border: 0; cursor: pointer; }
    details summary::-webkit-details-marker { display: none; }
    details summary { list-style: none; }
    .ind-table { width: 100%; border-collapse: collapse; }
    .ind-table th, .ind-table td { text-align: left; white-space: nowrap; }
    .ind-table tbody tr { border-bottom: 1px solid rgba(55,65,81,0.3); }
    .ind-table tbody tr:last-child { border-bottom: none; }
    .ind-table tbody tr:hover { background: rgba(31,41,55,0.3); }
    /* Custom scrollbar for market picker */
    #builder-market-picker::-webkit-scrollbar { width: 4px; }
    #builder-market-picker::-webkit-scrollbar-track { background: transparent; }
    #builder-market-picker::-webkit-scrollbar-thumb { background: #374151; border-radius: 2px; }
    #builder-market-picker::-webkit-scrollbar-thumb:hover { background: #4b5563; }
    /* Range slider thumb size in market rows */
    .group\/row input[type=range]::-webkit-slider-thumb { width: 10px; height: 10px; margin-top: -3px; }
    .group\/row input[type=range]::-moz-range-thumb { width: 10px; height: 10px; }
    /* Backtest threshold sliders */
    #bt-buy-slider::-webkit-slider-thumb { background: #22c55e; }
    #bt-sell-slider::-webkit-slider-thumb { background: #ef4444; }
  </style>
</head>
<body class="bg-gray-950 text-gray-200 min-h-screen">

  <!-- Top Navigation -->
  <nav class="sticky top-0 z-50 bg-gray-950/95 backdrop-blur border-b border-gray-800/50">
    <div class="max-w-7xl mx-auto px-4">
      <div class="flex items-center justify-between h-14">
        <div class="flex items-center gap-1">
          <span class="text-sm font-semibold text-gray-300 mr-4 hidden sm:inline">PMSI</span>
          <a href="#indicators" data-nav="indicators" class="nav-link px-3 py-4 text-sm text-gray-500 border-b-2 border-transparent hover:text-gray-300">Indicators</a>
          <a href="#builder" data-nav="builder" class="nav-link px-3 py-4 text-sm text-gray-500 border-b-2 border-transparent hover:text-gray-300">Builder</a>
          <a href="#api" data-nav="api" class="nav-link px-3 py-4 text-sm text-gray-500 border-b-2 border-transparent hover:text-gray-300">API</a>
        </div>
        <div class="flex items-center gap-3">
          <div id="nav-score" class="text-sm tabular-nums text-gray-500"></div>
          <div id="auth-area"></div>
        </div>
      </div>
    </div>
  </nav>

  <div class="max-w-7xl mx-auto px-4 py-6">

    <!-- INDICATORS PAGE -->
    <div id="page-indicators" class="page space-y-5">
      <!-- Header + Toolbar -->
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-4">
          <h1 class="text-lg font-medium text-gray-200">Indicators</h1>
          <!-- View Toggle -->
          <div class="flex rounded-md overflow-hidden border border-gray-800">
            <button onclick="setIndicatorView('table')" id="ind-view-table" class="px-2.5 py-1 text-[11px] bg-gray-800 text-gray-200 transition-colors">Table</button>
            <button onclick="setIndicatorView('card')" id="ind-view-card" class="px-2.5 py-1 text-[11px] text-gray-500 hover:text-gray-300 transition-colors">Cards</button>
          </div>
          <select id="ind-sort" onchange="renderIndicatorsPage()" class="px-2 py-1 text-[11px] bg-gray-800/60 border border-gray-800 rounded-md text-gray-400 cursor-pointer focus:outline-none">
            <option value="score">Score</option>
            <option value="correlation">Correlation</option>
            <option value="newest">Newest</option>
            <option value="name">Name</option>
          </select>
        </div>
        <a href="#builder" class="px-4 py-1.5 bg-blue-600 text-white text-xs font-medium rounded-lg hover:bg-blue-500 transition-colors">+ New</a>
      </div>

      <!-- Unified indicator list -->
      <div id="indicators-sectors"></div>

      <!-- Comparison overlay chart -->
      <div id="comparison-panel" class="hidden mt-6 bg-gray-900/50 rounded-2xl p-6 border border-gray-800/50">
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-sm font-medium text-gray-300">Indicator Comparison</h3>
          <button onclick="comparisonState.selected.clear(); updateComparisonUI();" class="text-xs text-gray-500 hover:text-gray-300">Clear</button>
        </div>
        <div style="height:280px"><canvas id="comparison-chart"></canvas></div>
      </div>
    </div>

    <!-- BUILDER PAGE -->
    <div id="page-builder" class="page">

      <!-- Top bar: Name + Save -->
      <div class="flex items-center gap-3 mb-5">
        <input type="text" id="builder-name" placeholder="Indicator name…"
          class="flex-1 px-4 py-2 text-sm bg-gray-900/60 border border-gray-800 rounded-lg text-gray-200 placeholder-gray-600 focus:outline-none focus:border-blue-500/60">
        <div class="relative">
          <button onclick="toggleBuilderLoadMenu()" class="px-3 py-2 text-xs text-gray-400 bg-gray-900/60 border border-gray-800 rounded-lg hover:text-gray-200 hover:border-gray-700 transition-colors">
            Load &#9662;
          </button>
          <div id="builder-load-menu" class="hidden absolute right-0 mt-1 w-56 bg-gray-800 border border-gray-700 rounded-lg shadow-xl z-10 py-1"></div>
        </div>
        <button onclick="saveBuilderIndicator()" class="px-5 py-2 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-500 transition-colors font-medium">Save</button>
      </div>

      <!-- Two-panel: Left (chart + config), Right (market picker) -->
      <div class="grid grid-cols-1 lg:grid-cols-[1fr_340px] gap-5">

        <!-- Left column -->
        <div class="space-y-4">

          <!-- Chart -->
          <div class="bg-gray-900/40 rounded-xl p-5 border border-gray-800/30">
            <div class="flex items-center justify-between mb-3">
              <div id="builder-metrics" class="flex items-center gap-4"></div>
              <div class="flex gap-1">
                <button data-period="1W" onclick="setBuilderChartPeriod('1W')" class="px-2 py-0.5 text-xs text-gray-500 rounded hover:text-gray-300 transition-colors">1W</button>
                <button data-period="1M" onclick="setBuilderChartPeriod('1M')" class="px-2 py-0.5 text-xs text-gray-500 rounded hover:text-gray-300 transition-colors">1M</button>
                <button data-period="3M" onclick="setBuilderChartPeriod('3M')" class="px-2 py-0.5 text-xs text-gray-500 rounded hover:text-gray-300 transition-colors">3M</button>
                <button data-period="1Y" onclick="setBuilderChartPeriod('1Y')" class="px-2 py-0.5 text-xs text-gray-500 rounded hover:text-gray-300 transition-colors">1Y</button>
                <button data-period="ALL" onclick="setBuilderChartPeriod('ALL')" class="px-2 py-0.5 text-xs text-blue-400 rounded transition-colors">ALL</button>
                <button data-period="custom" onclick="showCustomDateRange()" class="px-2 py-0.5 text-xs text-gray-500 rounded hover:text-gray-300 transition-colors">Custom</button>
              </div>
            </div>
            <div style="height:340px">
              <canvas id="builder-chart"></canvas>
            </div>
          </div>

          <span id="builder-chart-ref-label" class="hidden">BTC Price</span>

          <!-- Backtest Panel -->
          <div id="backtest-panel" class="bg-gray-900/40 rounded-xl border border-gray-800/30 p-5">
            <div class="flex items-center justify-between mb-4">
              <h3 class="text-sm font-medium text-gray-300">Backtest</h3>
              <div class="flex items-center gap-3">
                <div id="builder-signal-sources" class="flex items-center gap-3"></div>
                <div id="builder-test-against" class="flex items-center gap-2"></div>
              </div>
            </div>

            <!-- Strategy + thresholds -->
            <div class="flex flex-col gap-3 mb-4">
              <!-- Strategy selector -->
              <div class="flex items-center gap-2">
                <span class="text-[10px] text-gray-500 uppercase tracking-wide shrink-0">Strategy</span>
                <div class="flex rounded-md overflow-hidden border border-gray-700/50">
                  <button id="bt-strat-momentum" onclick="setBtStrategy('momentum')"
                    class="px-2.5 py-1 text-[11px] bg-gray-800 text-gray-200 transition-colors">Momentum</button>
                  <button id="bt-strat-contrarian" onclick="setBtStrategy('contrarian')"
                    class="px-2.5 py-1 text-[11px] text-gray-500 hover:text-gray-300 transition-colors">Contrarian</button>
                  <button id="bt-strat-long_only" onclick="setBtStrategy('long_only')"
                    class="px-2.5 py-1 text-[11px] text-gray-500 hover:text-gray-300 transition-colors">Long Only</button>
                </div>
                <span id="bt-strat-hint" class="text-[10px] text-gray-600 ml-1 hidden sm:inline">Buy high conviction, sell on doubt</span>
              </div>
              <!-- Threshold sliders -->
              <div class="grid grid-cols-[1fr_1fr_auto] items-end gap-3">
                <label class="block">
                  <span id="bt-entry-label" class="text-[10px] text-gray-500 uppercase tracking-wide block mb-1">Enter above</span>
                  <div class="flex items-center gap-2">
                    <input type="range" id="bt-buy-slider" min="0" max="100" value="60" step="5" oninput="onBtSliderInput('buy',this.value)"
                      class="flex-1 h-1 rounded-full appearance-none cursor-pointer bg-gray-800 accent-green-500">
                    <input type="number" id="bt-buy" value="60" min="0" max="100" step="5" onchange="syncBtSlider('buy',this.value);renderBacktestPanel()"
                      class="w-12 px-1.5 py-1 text-xs bg-gray-800 border border-gray-700 rounded text-gray-300 text-center tabular-nums">
                  </div>
                </label>
                <label class="block">
                  <span id="bt-exit-label" class="text-[10px] text-gray-500 uppercase tracking-wide block mb-1">Exit below</span>
                  <div class="flex items-center gap-2">
                    <input type="range" id="bt-sell-slider" min="0" max="100" value="40" step="5" oninput="onBtSliderInput('sell',this.value)"
                      class="flex-1 h-1 rounded-full appearance-none cursor-pointer bg-gray-800 accent-red-500">
                    <input type="number" id="bt-sell" value="40" min="0" max="100" step="5" onchange="syncBtSlider('sell',this.value);renderBacktestPanel()"
                      class="w-12 px-1.5 py-1 text-xs bg-gray-800 border border-gray-700 rounded text-gray-300 text-center tabular-nums">
                  </div>
                </label>
                <div class="flex items-center gap-2">
                  <label class="flex items-center gap-1">
                    <span class="text-[10px] text-gray-500 uppercase tracking-wide">Cost</span>
                    <input type="number" id="bt-cost-bps" value="0" min="0" max="100" step="5"
                      class="w-14 px-1.5 py-1 text-xs bg-gray-800 border border-gray-700 rounded text-gray-300 text-center tabular-nums">
                    <span class="text-[10px] text-gray-500">bps</span>
                  </label>
                  <button onclick="renderBacktestPanel()" class="px-4 py-1.5 text-xs bg-blue-600/80 text-white rounded-lg hover:bg-blue-500 transition-colors">Run</button>
                  <button id="bt-trade-toggle" onclick="toggleTradeLog()" class="px-3 py-1.5 text-xs text-gray-400 border border-gray-700/50 rounded-lg hover:text-gray-200 transition-colors">Show Trades</button>
                </div>
              </div>
            </div>

            <!-- Results -->
            <div id="bt-results" class="text-xs text-gray-500">Configure strategy and click Run</div>

            <!-- Equity curve -->
            <div id="bt-equity-wrap" class="hidden mt-4 border-t border-gray-800/40 pt-4">
              <div style="height:120px"><canvas id="bt-equity-chart"></canvas></div>
            </div>

            <!-- Trade log -->
            <div id="bt-trade-log" class="hidden mt-4 border-t border-gray-800/40 pt-4 max-h-80 overflow-y-auto"></div>
          </div>
        </div>

        <!-- Right: Market Picker -->
        <div class="flex flex-col bg-gray-900/40 rounded-xl border border-gray-800/30 overflow-hidden" style="max-height: calc(100vh - 120px)">

          <!-- Selected basket summary -->
          <div id="builder-basket" class="shrink-0 px-3 pt-3 pb-2"></div>

          <!-- Search + filters -->
          <div class="shrink-0 px-3 pb-3 space-y-2 border-b border-gray-800/40">
            <div class="relative">
              <svg class="absolute left-2.5 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
              <input type="text" id="builder-market-search" placeholder="Search markets…"
                oninput="onBuilderMarketSearch(this.value)"
                class="w-full pl-8 pr-3 py-1.5 text-xs bg-gray-800/60 border border-gray-700/50 rounded-md text-gray-200 placeholder-gray-600 focus:outline-none focus:border-blue-500/50">
            </div>
            <div class="flex items-center gap-2 text-[10px] flex-wrap">
              <select id="builder-market-sort" onchange="onBuilderMarketSort(this.value)"
                class="bg-gray-800/60 border border-gray-700/50 text-gray-400 rounded px-1.5 py-1 text-[10px] focus:outline-none cursor-pointer">
                <option value="volume">Volume</option>
                <option value="resolution">Resolution</option>
                <option value="prob_high">Prob ↓</option>
                <option value="prob_low">Prob ↑</option>
                <option value="alpha">A→Z</option>
              </select>
              <label class="flex items-center gap-1 text-gray-500 cursor-pointer select-none">
                <input type="checkbox" id="builder-hide-expired" checked onchange="onBuilderFilterChange()"
                  class="rounded bg-gray-700 border-gray-600 w-2.5 h-2.5 cursor-pointer">
                Expired
              </label>
              <label class="flex items-center gap-1 text-gray-500 cursor-pointer select-none">
                <input type="checkbox" id="builder-hide-resolved" checked onchange="onBuilderFilterChange()"
                  class="rounded bg-gray-700 border-gray-600 w-2.5 h-2.5 cursor-pointer">
                Resolved
              </label>
              <span id="builder-market-count" class="text-gray-600 ml-auto tabular-nums"></span>
            </div>
          </div>

          <!-- Scrollable market list -->
          <div id="builder-market-picker" class="flex-1 overflow-y-auto p-3 space-y-2.5"></div>
        </div>

      </div>
    </div>

    <!-- API PAGE -->
    <div id="page-api" class="page space-y-6">
      <div class="flex items-center justify-between">
        <h1 class="text-xl font-light text-gray-300 tracking-wide">API</h1>
      </div>
      <div id="api-panel-content"></div>
    </div>

    <!-- Footer -->
    <footer class="text-center text-xs text-gray-600 py-6 mt-8">
      Data from Polymarket public APIs &middot; Scores are informational only, not financial advice.
    </footer>

  </div>

  <!-- Alert Modal -->
  <div id="alert-modal" class="hidden fixed inset-0 z-[100] flex items-center justify-center bg-black/60 backdrop-blur-sm">
    <div class="bg-gray-900 rounded-2xl border border-gray-700 w-full max-w-sm mx-4 p-6 relative">
      <button onclick="closeAlertModal()" class="absolute top-4 right-4 text-gray-500 hover:text-gray-300 text-xl">&times;</button>
      <h3 class="text-sm font-medium text-gray-200 mb-1">Set Alert</h3>
      <p id="alert-indicator-name" class="text-xs text-gray-500 mb-4"></p>
      <input type="hidden" id="alert-indicator-id">

      <label class="block text-xs text-gray-400 mb-1">Condition</label>
      <select id="alert-condition" onchange="toggleAlertThreshold()"
        class="w-full px-3 py-2 text-xs bg-gray-800 border border-gray-700 rounded-lg text-gray-300 mb-3">
        <option value="crosses_above">Crosses above</option>
        <option value="crosses_below">Crosses below</option>
        <option value="daily_summary">Daily summary</option>
      </select>

      <div id="alert-threshold-wrap">
        <label class="block text-xs text-gray-400 mb-1">Threshold (0-100)</label>
        <input type="number" id="alert-threshold" value="60" min="0" max="100" step="5"
          class="w-full px-3 py-2 text-xs bg-gray-800 border border-gray-700 rounded-lg text-gray-300 mb-3">
      </div>

      <label class="block text-xs text-gray-400 mb-1">Channel</label>
      <select id="alert-channel"
        class="w-full px-3 py-2 text-xs bg-gray-800 border border-gray-700 rounded-lg text-gray-300 mb-3">
        <option value="email">Email</option>
        <option value="webhook">Webhook URL</option>
        <option value="discord">Discord Webhook</option>
      </select>

      <label class="block text-xs text-gray-400 mb-1">Destination</label>
      <input type="text" id="alert-destination" placeholder="email@example.com or https://..."
        class="w-full px-3 py-2 text-xs bg-gray-800 border border-gray-700 rounded-lg text-gray-300 mb-4">

      <div id="alert-error" class="text-red-400 text-xs mb-2"></div>
      <button onclick="createAlert()" class="w-full px-4 py-2 bg-blue-600 text-white text-sm rounded-lg hover:bg-blue-500 transition-colors">Create Alert</button>
    </div>
  </div>

  <!-- Auth Modal -->
  <div id="auth-modal" class="hidden fixed inset-0 z-[100] flex items-center justify-center bg-black/60 backdrop-blur-sm">
    <div class="bg-gray-900 rounded-2xl border border-gray-700 w-full max-w-md mx-4 p-6 relative">
      <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-gray-500 hover:text-gray-300 text-xl">&times;</button>

      <!-- Wallet Connect -->
      <button onclick="connectPhantom()" class="w-full flex items-center justify-center gap-3 px-4 py-3 bg-purple-600 text-white rounded-xl hover:bg-purple-500 transition-colors mb-4">
        <svg width="20" height="20" viewBox="0 0 128 128" fill="white"><path d="M110.6 49.4c-2.1-12.8-10.2-24-22.1-30.5C76.7 12.4 62.4 11.3 49.6 16 36.7 20.7 26.4 30.9 21.5 43.7c-4.8 12.8-3.8 27 2.8 38.9 6.6 11.9 17.8 20.1 30.6 22.4 3.2.6 6.4.9 9.6.9 9.7 0 19.1-3.2 27-9.2 1.4-1.1 1.7-3 .6-4.4s-3-1.7-4.4-.6c-11 8.3-25.2 10.4-38.2 5.7-13-4.7-22.8-15.3-26.4-28.8-3.6-13.5-.5-27.8 8.4-38.5C40.3 19.4 53.3 13.7 67 14.2c13.7.5 26.2 7.2 33.8 18.2 4.3 6.2 6.8 13.4 7.4 20.8H97.9c-4.4 0-8 3.6-8 8v24c0 4.4 3.6 8 8 8h10c4.4 0 8-3.6 8-8V61.2c0-4-2-7.7-5.3-9.8v-2z"/></svg>
        Connect Phantom Wallet
      </button>

      <div class="flex items-center gap-3 mb-4">
        <div class="flex-1 border-t border-gray-700"></div>
        <span class="text-xs text-gray-500 uppercase">or</span>
        <div class="flex-1 border-t border-gray-700"></div>
      </div>

      <!-- Email Tabs -->
      <div class="flex border-b border-gray-700 mb-4">
        <button id="auth-tab-login" onclick="switchAuthTab('login')" class="px-4 py-2 text-sm border-b-2 border-blue-500 text-gray-200 transition-colors">Login</button>
        <button id="auth-tab-register" onclick="switchAuthTab('register')" class="px-4 py-2 text-sm border-b-2 border-transparent text-gray-500 transition-colors">Register</button>
      </div>

      <div id="auth-error" class="text-red-400 text-sm mb-3"></div>

      <!-- Login Form -->
      <form id="auth-form-login" onsubmit="handleLoginSubmit(event)">
        <input id="login-email" type="email" placeholder="Email" required
          class="w-full px-4 py-2.5 mb-3 bg-gray-800 border border-gray-700 rounded-lg text-gray-200 placeholder-gray-500 focus:outline-none focus:border-blue-500">
        <input id="login-password" type="password" placeholder="Password" required
          class="w-full px-4 py-2.5 mb-4 bg-gray-800 border border-gray-700 rounded-lg text-gray-200 placeholder-gray-500 focus:outline-none focus:border-blue-500">
        <button type="submit" class="w-full px-4 py-2.5 bg-blue-600 text-white rounded-lg hover:bg-blue-500 transition-colors">Sign In</button>
      </form>

      <!-- Register Form -->
      <form id="auth-form-register" class="hidden" onsubmit="handleRegisterSubmit(event)">
        <input id="register-name" type="text" placeholder="Display Name"
          class="w-full px-4 py-2.5 mb-3 bg-gray-800 border border-gray-700 rounded-lg text-gray-200 placeholder-gray-500 focus:outline-none focus:border-blue-500">
        <input id="register-email" type="email" placeholder="Email" required
          class="w-full px-4 py-2.5 mb-3 bg-gray-800 border border-gray-700 rounded-lg text-gray-200 placeholder-gray-500 focus:outline-none focus:border-blue-500">
        <input id="register-password" type="password" placeholder="Password (8+ chars)" required minlength="8"
          class="w-full px-4 py-2.5 mb-4 bg-gray-800 border border-gray-700 rounded-lg text-gray-200 placeholder-gray-500 focus:outline-none focus:border-blue-500">
        <button type="submit" class="w-full px-4 py-2.5 bg-blue-600 text-white rounded-lg hover:bg-blue-500 transition-colors">Create Account</button>
      </form>
    </div>
  </div>

  <script src="js/sectors.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/sandbox.js"></script>
  <script src="js/api-panel.js"></script>

</body>
</html>
